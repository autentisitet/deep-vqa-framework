# .github/workflows/ci.yaml
name: CI

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-scripts:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all shell scripts syntax
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            bash -n "$f" && echo "  OK: $f" || { echo "  FAIL: $f"; failed=1; }
          done < <(find scripts -type f -name "*.sh" -print0)
          exit $failed



  smart-extract-test:
    name: Smart Extract Logic Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zip/unzip
        run: sudo apt-get update -qq && sudo apt-get install -y zip unzip

      - name: Run smart_extract test
        run: bash scripts/ci_test_extract.sh



  docker-build-train:
    name: Docker Build (train)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build train image
        run: |
          docker build --target train -t vqa-train:test .
          docker images | grep vqa-train



  docker-build-infer:
    name: Docker Build (infer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inference image
        run: |
          docker build --target prod -t vqa-infer:test .
          docker images | grep vqa-infer


  deployment-contract:
    name: Deployment and Health Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          docker compose -f deploy-config/compose/docker-compose.yaml -f deploy-config/compose/docker-compose.docker.yaml -f deploy-config/ollama/docker-compose.yaml config --quiet
      - name: Validate Nginx configuration syntax
        run: |
          docker run --rm -v "$PWD/deploy-config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
      - name: Validate deployment profiles and image inputs
        run: |
          test -f deploy-config/profiles/infer_deploy.internal.yaml
          test -f deploy-config/profiles/infer_deploy.public.yaml
          grep -Eq '^auth:[[:space:]]*$' deploy-config/profiles/infer_deploy.internal.yaml
          grep -Eq '^[[:space:]]+mode:[[:space:]]+api_key' deploy-config/profiles/infer_deploy.internal.yaml
          grep -Eq '^[[:space:]]+backend:[[:space:]]+sqlite' deploy-config/profiles/infer_deploy.internal.yaml
          grep -Eq '^[[:space:]]+mode:[[:space:]]+none' deploy-config/profiles/infer_deploy.public.yaml
          grep -Eq '^[[:space:]]+backend:[[:space:]]+none' deploy-config/profiles/infer_deploy.public.yaml
          grep -q 'COPY deploy-config/ ./deploy-config/' Dockerfile
      - name: Compile runtime packages
        run: python -m compileall -q deploy src scripts



  lock-check:
    name: Lock File Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check lock file is consistent
        run: |
          uv lock --check
          echo "uv.lock is up-to-date with pyproject.toml"


  code-quality:
    name: Ruff and Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          make install DEV=1
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev --locked

      - name: Run Makefile code checks
        run: make check-code

      - name: Run Makefile type checks
        run: make typecheck

      - name: Run pytest suite
        run: make pytest

      - name: Verify synchronized project version
        run: make version-check
