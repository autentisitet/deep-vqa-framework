# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "examples/**"
      - "docs/assets/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "examples/**"
      - "docs/assets/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shell-scripts:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all shell scripts syntax
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            bash -n "$f" && echo "  OK: $f" || { echo "  FAIL: $f"; failed=1; }
          done < <(find scripts -type f -name "*.sh" -print0)
          exit $failed



  smart-extract-test:
    name: Smart Extract Logic Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zip/unzip
        run: sudo apt-get update -qq && sudo apt-get install -y zip unzip

      - name: Run smart_extract test
        run: bash scripts/ci_test_extract.sh



  docker-build-train:
    name: Docker Build (train)
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build train image
        run: |
          docker build --target train -t vqa-train:test .
          docker images | grep vqa-train



  docker-build-infer:
    name: Docker Build (infer)
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build inference image
        run: |
          docker build --target prod -t vqa-infer:test .
          docker images | grep vqa-infer


  deployment-contract:
    name: Deployment and Health Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Docker Compose configuration
        run: |
          DEEP_VQA_DEPLOYMENT_CONFIG=deploy-config/profiles/infer_deploy.internal.yaml \
          docker compose -f deploy-config/compose/docker-compose.yaml -f deploy-config/compose/docker-compose.docker-cpu.yaml config --quiet
          DEEP_VQA_DEPLOYMENT_CONFIG=deploy-config/profiles/infer_deploy.internal.yaml \
          docker compose -f deploy-config/compose/docker-compose.yaml -f deploy-config/compose/docker-compose.docker-gpu.yaml config --quiet
          DEEP_VQA_DEPLOYMENT_CONFIG=deploy-config/profiles/infer_deploy.internal.yaml \
          docker compose -f deploy-config/compose/docker-compose.yaml -f deploy-config/compose/docker-compose.podman-cpu.yaml config --quiet
          DEEP_VQA_DEPLOYMENT_CONFIG=deploy-config/profiles/infer_deploy.internal.yaml \
          docker compose -f deploy-config/compose/docker-compose.yaml -f deploy-config/compose/docker-compose.podman-gpu.yaml config --quiet
      - name: Validate Nginx configuration syntax
        run: |
          docker run --rm \
            --add-host vqa-infer:127.0.0.1 \
            -v "$PWD/deploy-config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy-config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Validate deployment profiles and image inputs
        run: |
          test -f deploy-config/profiles/infer_deploy.internal.yaml
          test -f deploy-config/profiles/infer_deploy.proxy.yaml
          test -f deploy-config/profiles/infer_deploy.local.yaml
          grep -Eq '^auth:[[:space:]]*$' deploy-config/profiles/infer_deploy.internal.yaml
          grep -Eq '^[[:space:]]+mode:[[:space:]]+accounts' deploy-config/profiles/infer_deploy.internal.yaml
          grep -Eq '^[[:space:]]+backend:[[:space:]]+sqlite' deploy-config/profiles/infer_deploy.internal.yaml
          grep -Eq '^[[:space:]]+mode:[[:space:]]+none' deploy-config/profiles/infer_deploy.proxy.yaml
          grep -Eq '^[[:space:]]+backend:[[:space:]]+none' deploy-config/profiles/infer_deploy.proxy.yaml
          grep -Eq '^[[:space:]]+mode:[[:space:]]+none' deploy-config/profiles/infer_deploy.local.yaml
          grep -Eq '^[[:space:]]+backend:[[:space:]]+sqlite' deploy-config/profiles/infer_deploy.local.yaml
          grep -q 'COPY deploy-config/ ./deploy-config/' Dockerfile
      - name: Compile runtime packages
        run: python -m compileall -q deploy src scripts



  lock-check:
    name: Lock File Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check lock file is consistent
        run: |
          uv lock --check
          echo "uv.lock is up-to-date with pyproject.toml"


  code-quality:
    name: Ruff and Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          make install DEV=1
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev --locked

      - name: Run Makefile code checks
        run: make check-code

      - name: Run Makefile type checks
        run: make typecheck

      - name: Run pytest suite
        run: make pytest

      - name: Verify synchronized project version
        run: make version-check
