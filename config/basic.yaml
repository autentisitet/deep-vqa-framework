# config/basic.yaml
system:
  amp: true
  pin_memory: true


preprocessing:
    k_fold: 5


logging:
    log_interval: 10


train:
  optimizer: "adamw"
  scheduler: "cosine"
  gradient_accumulation_steps: 4  # 每 4 个 batch 更新一次

  early_stop:
    enabled: true
    patience: 10
    monitor: "val_srocc"
    mode: "max"             # 监控 SROCC，模式为 "max"

  checkpoint:
    monitor: "val_srocc"
    # Only used to break ties when two checkpoints have the same primary score.
    secondary_monitor: "val_plcc"
    mode: "max"
    save_top_k: 2
