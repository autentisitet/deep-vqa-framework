server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 101m;
    client_body_timeout 30s;

    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_conn api_connections 10;
        proxy_pass http://vqa-infer:8000/v1/auth/login;
        proxy_http_version 1.1;
        # $http_host preserves the client's Host verbatim, including a
        # non-default port. $host drops the port, which makes the application's
        # same-origin check compare "http://127.0.0.1" against the browser's
        # "http://127.0.0.1:8000" Origin and reject every authenticated
        # state-changing request.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Keep the generated API explorer and schema on the loopback-only diagnostic
    # port. Public browsers need the documented /api/v1 routes, not the explorer.
    location ^~ /api/docs { return 404; }
    location ^~ /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }

    # Avoid Nginx's implicit 301 redirect from /api to /api/.
    location = /api {
        return 404;
    }

    location /api/ {
        limit_req zone=api_requests burst=15 nodelay;
        limit_conn api_connections 10;
        proxy_pass http://vqa-infer:8000/;
        proxy_http_version 1.1;
        # See the login location: keep the port so same-origin checks match.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
