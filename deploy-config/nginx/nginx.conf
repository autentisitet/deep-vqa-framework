worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # A request line longer than one large buffer yields HTTP 414; oversized
    # individual request headers yield HTTP 400 before reaching Uvicorn.
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;


    # Public reverse-proxy protection. FastAPI also applies an in-process login limit as
    # a fallback when it is reached directly from a trusted local network.
    limit_req_zone $binary_remote_addr zone=api_requests:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=api_connections:10m;
    # Nginx defaults to 503 for limit_req/limit_conn rejections. These are
    # client-side throttling events, not service outages.
    limit_req_status 429;
    limit_conn_status 429;

    # A local HTTPS front proxy sets X-Forwarded-Proto. Without this map,
    # the bundled Nginx would overwrite https with its internal http scheme.
    # Only the explicitly bound loopback entry may receive this header.
    map $http_x_forwarded_proto $client_proto {
        default $scheme;
        https https;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    sendfile on;

    include /etc/nginx/conf.d/*.conf;
}
