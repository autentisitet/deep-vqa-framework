[project]
name = "deep-vqa-framework"
version = "0.9.6"
description = "Unified deep learning framework for Image and Video Quality Assessment (IQA/VQA)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "deep-learning",
    "computer-vision",
    "image-quality-assessment",
    "video-quality-assessment",
    "pytorch",
    "iqa",
    "vqa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "av>=14.0.0",
    "decord>=0.6.0",
    "fastapi>=0.139.2",
    "gdown>=6.0.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "numpy>=2.0.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "pydantic>=2.0.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.51.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "black>=26.5.1",
    "isort>=8.0.1",
]

[project.urls]
Homepage = "https://github.com/autentisitet/deep-vqa-framework"
Repository = "https://github.com/autentisitet/deep-vqa-framework.git"
Issues = "https://github.com/autentisitet/deep-vqa-framework/issues"


[tool.hatch.build.targets.wheel]
packages = ["src", "deploy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"




[tool.black]
line-length = 120
target-version = ["py312"]


[tool.ruff]
line-length = 120
target-version = "py312"


[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID251"]
ignore = [
    "E501",   # line too long (handled by formatter)
]


[tool.ruff.lint.per-file-ignores]
# The entry point pins thread counts (OMP/MKL/OpenBLAS, cv2.setNumThreads)
# before importing torch, cv2, or the training stack, so the imports that
# follow those statements are intentional rather than misordered.
"src/main.py" = ["F401", "E402"]


[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use a concrete type, a generic, or object with explicit narrowing."
"typing_extensions.Any".msg = "Use a concrete type, a generic, or object with explicit narrowing."


[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false


[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["src"]
skip_gitignore = true


# Install PyTorch from the CPU-only index. The default deployment is CPU and
# this drops the entire nvidia/cuda/triton dependency chain that otherwise
# ships with the PyPI Linux wheels, which is also the main source of Dependabot
# security alerts. GPU users can override these sources with a CUDA index.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
