# docker/docker-compose.podman.yaml
services:
  vqa-train:
    build:
      network: host
    network_mode: host
    security_opt:
      - label=disable
    devices:
      - nvidia.com/gpu=all

  vqa-infer:
    build:
      network: host
    security_opt:
      - label=disable
    devices:
      - nvidia.com/gpu=all
