# docker/docker-compose.podman.yaml
services:
  vqa-train:
    network_mode: host
    security_opt:
      - label=disable
    devices:
      - nvidia.com/gpu=all

  vqa-infer:
    security_opt:
      - label=disable
    devices:
      - nvidia.com/gpu=all

  nginx:
    # Fedora/RHEL Podman with SELinux requires relabeling bind mounts.
    # This override keeps the generic Docker compose file portable.
    volumes:
      - ../frontend:/usr/share/nginx/html:ro,Z
      - ../results:/srv/deep-vqa/results:ro,Z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
