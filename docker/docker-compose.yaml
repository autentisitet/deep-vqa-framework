# docker/docker-compose.yaml
services:
  vqa-train:
    build:
      context: ..
      dockerfile: Dockerfile
      target: train
    image: vqa-train:latest
    container_name: vqa-train
    shm_size: 16gb
    volumes:
      - ../datasets:/app/datasets
      - ../results:/app/results
      - ../reports:/app/reports
      - ../deploy/iqa-models:/app/deploy/iqa-models
      - ../deploy/vqa-models:/app/deploy/vqa-models
      - ../.cache:/app/.cache
    environment:
      - XDG_CACHE_HOME=/app/.cache
      - TORCH_HOME=/app/.cache/torch
      - UV_CACHE_DIR=/app/.cache/uv
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"


  vqa-infer:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    image: vqa-prod:latest
    container_name: vqa-prod
    shm_size: 8gb
    expose:
      - "8000"
    volumes:
      - ../deploy/iqa-models:/app/deploy/iqa-models
      - ../deploy/vqa-models:/app/deploy/vqa-models
      - ../examples:/app/examples
      - ../reports:/app/reports
      - ../.cache:/app/.cache
    environment:
      - XDG_CACHE_HOME=/app/.cache
      - TORCH_HOME=/app/.cache/torch
      - UV_CACHE_DIR=/app/.cache/uv
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: vqa-nginx
    depends_on:
      - vqa-infer
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
