# docker/docker-compose.yaml
services:
  vqa-train:
    build:
      context: ..
      dockerfile: Dockerfile
      target: train
    image: vqa-train:latest
    container_name: vqa-train
    shm_size: 16gb
    volumes:
      - ../datasets:/app/datasets
      - ../results:/app/results
      - ../reports:/app/reports
      - ../deploy/iqa-models:/app/deploy/iqa-models
      - ../deploy/vqa-models:/app/deploy/vqa-models
      - ../.cache:/app/.cache
    environment:
      - XDG_CACHE_HOME=/app/.cache
      - TORCH_HOME=/app/.cache/torch
      - UV_CACHE_DIR=/app/.cache/uv
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1},vqa-train,vqa-infer,vqa-nginx,nginx
      - no_proxy=${no_proxy:-localhost,127.0.0.1},vqa-train,vqa-infer,vqa-nginx,nginx
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"


  vqa-infer:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    image: vqa-infer:latest
    container_name: vqa-infer
    shm_size: 8gb
    expose:
      - "8000"
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ../deploy/iqa-models:/app/deploy/iqa-models
      - ../deploy/vqa-models:/app/deploy/vqa-models
      - ../examples:/app/examples
      - ../reports:/app/reports
      - ../results:/app/results
      - ../docs:/app/docs
      - ../.cache:/app/.cache
    environment:
      - XDG_CACHE_HOME=/app/.cache
      - TORCH_HOME=/app/.cache/torch
      - UV_CACHE_DIR=/app/.cache/uv
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1},vqa-train,vqa-infer,vqa-nginx,nginx
      - no_proxy=${no_proxy:-localhost,127.0.0.1},vqa-train,vqa-infer,vqa-nginx,nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8000/v1/health', timeout=5)"]
      start_period: 90s
      interval: 15s
      timeout: 10s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: vqa-nginx
    depends_on:
      vqa-infer:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../results:/srv/deep-vqa/results:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1},vqa-train,vqa-infer,vqa-nginx,nginx
      - no_proxy=${no_proxy:-localhost,127.0.0.1},vqa-train,vqa-infer,vqa-nginx,nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
