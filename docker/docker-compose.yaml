# docker/docker-compose.yaml
version: '3.8'

services:
  vqa-train:
    build:
      context: ..
      dockerfile: Dockerfile
      target: train
    image: vqa-train:latest
    container_name: vqa-train
    shm_size: 16gb
    volumes:
      - ../datasets:/app/datasets
      - ../results:/app/results
      - ../reports:/app/reports
      - ../logs:/app/logs
      - ../.download_cache:/app/.download_cache
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"


  vqa-infer:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    image: vqa-prod:latest
    container_name: vqa-prod
    shm_size: 8gb
    ports:
      - "8000:8000"
    volumes:
      - ../deploy/iqa-models:/app/deploy/iqa-models
      - ../deploy/vqa-models:/app/deploy/vqa-models
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3