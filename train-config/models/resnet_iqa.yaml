# train-config/models/resnet_iqa.yaml | schema release: v0.9.0
task_type: "iqa"

model:
  name: "IQAVQANet"
  backbone: "resnet50"
  freeze_backbone: false
  pretrained: true
  dropout: 0.3
  input_size: 224
  num_frames: 8

preprocessing:
  batch_size: 32
  num_workers: 4

train:
  epochs: 50
  lr: 0.0001
  weight_decay: 1.0e-4
  grad_clip: 0.5
  gradient_accumulation_steps: 4
  early_stop:
    enabled: true
    patience: 10
    monitor: "val_srocc"
    mode: "max"
  checkpoint:
    monitor: "val_srocc"
    mode: "max"
    save_top_k: 2

loss:
  smooth_l1_weight: 0.7
  rank_weight: 0.3
  huber_delta: 0.1
  rank_epsilon: 0.01
  max_pairs: 5000
